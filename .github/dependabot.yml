version: 2
# Grouped monthly updates (fleet template, owner decision 2026-11-21).
# Every entry runs monthly (the 1st, 02:00 UTC), keeps at most 2 PRs open, and
# waits 7 days after a release (cooldown). Lockstep groups come first because
# Dependabot puts a dependency in the FIRST group it matches; then one
# minor-patch group. Majors stay ungrouped, one PR each, so a breaking change
# is read on its own. Security updates ignore the schedule and the limit.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      github-actions-all:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    # SR-80/#616: these versions require rustc 1.95, above the declared MSRV 1.85.
    ignore:
      - dependency-name: "parking_lot"
        versions: [">=0.13.0"]
      - dependency-name: "parking_lot_core"
        versions: [">=0.10.0"]
      - dependency-name: "lock_api"
        versions: [">=0.5.0"]
    groups:
      # wasmparser, wasm-encoder, wat and wast come from one wasm-tools release
      # and must move together.
      wasm-tools-family:
        patterns:
          - "wasmparser"
          - "wasm-encoder"
          - "wasmprinter"
          - "wat"
          - "wast"
      minor-patch:
        update-types:
          - minor
          - patch
