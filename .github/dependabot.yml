version: 2
updates:
  # Check for updates to Rust crate dependencies.
  # Grouped: one PR per run instead of one per crate, so CI runs once.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    # SR-80/#616: these versions require rustc 1.95, above the declared MSRV 1.85.
    ignore:
      - dependency-name: "parking_lot"
        versions: [">=0.13.0"]
      - dependency-name: "parking_lot_core"
        versions: [">=0.10.0"]
      - dependency-name: "lock_api"
        versions: [">=0.5.0"]
    groups:
      cargo:
        patterns:
          - "*"

  # Check for updates to GitHub Actions (grouped, as above)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
