version: 2
updates:
  # Check for updates to Rust crate dependencies.
  # Grouped: one PR per run instead of one per crate, so CI runs once.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    groups:
      cargo:
        patterns:
          - "*"

  # Check for updates to GitHub Actions (grouped, as above)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
