name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual triggering
    inputs:
      run_extended_analysis: # Input to specifically trigger Kani/Miri
        description: 'Run Kani and Miri extended static analysis?'
        required: false
        default: false # Boolean false, not string
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read
  checks: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ci_checks_and_docs:
    name: CI Checks & Docs
    runs-on: ubuntu-latest
    # This job runs on push, PR, and all manual triggers (regardless of input)
    steps:
      - uses: actions/checkout@v7
      - name: Cargo Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable # Or match your rust-toolchain.toml for building cargo-kiln
          override: true
          components: rustfmt
      # SR-73: every step in this required check can fail. Reports that are
      # informational only live in the non-required "Quality Report" job.
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Documentation builds without warnings
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --document-private-items
      - name: Every workspace target compiles (SR-32)
        run: cargo build --workspace --all-targets

  code_quality:
    name: Code Quality Checks
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy
      - name: Install and setup cargo-kiln
        run: |
          cargo build --package cargo-kiln
          cargo install --path cargo-kiln --force
          cargo-kiln setup --check # Verify tools are available
      - name: Check for test files in src/
        run: cargo-kiln validate --check-test-files
      - name: Check module documentation coverage
        run: cargo-kiln validate --check-docs
      - name: Check platform feature compilation (VxWorks, Zephyr, Tock)
        run: |
          echo "=== VxWorks platform feature check ==="
          cargo check -p kiln-platform --features "platform-vxworks,std"
          cargo check -p kiln-platform --features "platform-vxworks,real-time,std"
          echo "=== Zephyr platform feature check ==="
          cargo check -p kiln-platform --features "platform-zephyr"
          echo "=== Tock platform feature check ==="
          cargo check -p kiln-platform --features "platform-tock"
          echo "All platform feature checks passed"
      - name: Check for WASI stub implementations in engine (architectural invariant)
        run: |
          # Engine must NOT contain hardcoded WASI function implementations
          # Per CLAUDE.md: Engine has ZERO WASI-specific stub code - all dispatch goes through kiln-wasi
          # Pattern matches: match arms like ("wasi:cli/stdout", "get-stdout") => { ... }
          if grep -nE '^\s*\("wasi:' kiln-runtime/src/stackless/engine.rs; then
            echo "ERROR: Hardcoded WASI function implementations found in engine.rs"
            echo "All WASI dispatch must go through kiln-wasi/src/dispatcher.rs"
            echo "Engine should only use WasiDispatcher, not implement WASI functions directly"
            exit 1
          fi
          echo "Engine architecture check passed - no hardcoded WASI stubs in engine"

  quality_report:
    # Informational only (maintainer decision 2026-10-22): NOT a required check.
    # These are quality metrics, not correctness gates; their findings are
    # tracked as issues. Each step reports its result without failing the job.
    name: Quality Report (informational)
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: clippy
      - name: Install cargo-kiln
        run: cargo install --path cargo-kiln --force
      - name: Documentation audit (READMEs, metadata, doc coverage)
        run: cargo-kiln validate --all
        continue-on-error: true
      - name: Pedantic clippy
        run: cargo-kiln check --strict
        continue-on-error: true
      - name: Text-search safety report (superseded as a gate by clippy + unsafe policy)
        run: cargo-kiln verify --asil d --detailed
        continue-on-error: true

  core_tests_and_analysis:
    name: Core Tests, Analysis & Coverage
    runs-on: [self-hosted, linux, x64, rust-cpu]
    # This job runs on push, PR, and all manual triggers (regardless of input)
    steps:
      - uses: actions/checkout@v7
        with:
          # The WAST tests decode files from the external/testsuite submodule (SR-73).
          submodules: true
      - name: Cargo Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable # For cargo-kiln. Nightly for UDeps should be handled internally.
          override: true
          components: llvm-tools-preview # For coverage
      - name: Install cargo-kiln
        run: |
          cargo build --package cargo-kiln
          cargo install --path cargo-kiln --force
      # SR-73: cargo-kiln test runs `cargo test --workspace --no-fail-fast`,
      # judges by cargo's exit status and real counts, and fails on a timeout.
      # Coverage runs in the "Code Coverage" job; reports in "Quality Report".
      - name: Run Tests
        run: cargo-kiln test

  safety_verification:
    name: SCORE-Inspired Safety Verification
    runs-on: [self-hosted, linux, x64, rust-cpu]
    # Measured over 25 successful runs (2026-10): 1.2-7.9 min, median 3.8.
    # A hung run held this required check for 2h on #540 (#543); fail fast.
    timeout-minutes: 30
    # Run safety verification on all pushes and PRs
    steps:
      - uses: actions/checkout@v7
      - name: Cargo Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-safety-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      # SR-73 (maintainer decision 2026-10-22): the safety gate uses precise,
      # compiler-backed facts, not text-search counts. unwrap/expect/panic/
      # unreachable are gated by "Safety Analysis with Clippy".
      - name: Unsafe code only in allow-listed crates
        # Every crate root carries #![deny(unsafe_code)] or #![forbid(unsafe_code)]
        # unless listed, with a reason, in safety/unsafe-allowlist.yaml.
        run: cargo test -p kiln-build-core --test unsafe_policy
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.0 --locked
      - name: Supply chain (advisories, bans, licenses, sources)
        run: cargo deny check

  verus_verification:
    name: Verus Formal Verification
    runs-on: macos-latest
    # Run on pushes to main and manual triggers
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-verus
          repository-cache: true
      - name: Install Rust toolchain (for Verus sysroot)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
      - name: Run Verus verification (StaticVec + StaticQueue + StaticString)
        run: |
          bazel test \
            //kiln-foundation/src/verus_proofs:static_vec_verify \
            //kiln-foundation/src/verus_proofs:static_queue_verify \
            //kiln-foundation/src/verus_proofs:static_string_verify

  extended_static_analysis:
    name: Extended Static Analysis (Miri, Kani)
    runs-on: ubuntu-latest
    # Only run this job if the workflow was manually dispatched AND the input was true
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_extended_analysis == true # Compare to boolean true
    needs: [ci_checks_and_docs, core_tests_and_analysis, safety_verification] # Optional: wait for other jobs
    steps:
      - uses: actions/checkout@v7
      - name: Cargo Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-extended-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          # Kani/Miri might need nightly or specific stable. Adjust as needed.
          # The cargo-kiln should ideally manage this internally.
          toolchain: stable # Or nightly if Kani/Miri need it directly for cargo-kiln compilation
          override: true
          # Add components if they can be installed via rustup and cargo-kiln doesn't handle it
          # components: miri, kani # (kani might need manual install steps)
      - name: Install and setup cargo-kiln for extended analysis
        run: |
          cargo build --package cargo-kiln
          cargo install --path cargo-kiln --force
          cargo-kiln setup --all # Setup all tools including Kani and Miri
      # Run advanced static analysis
      - name: Run Miri Checks
        run: cargo-kiln verify --asil d --no-kani
      - name: Run Kani Checks
        run: cargo-kiln kani-verify --asil-profile d --verbose

# Coverage job is still Linux-only as tarpaulin only supports Linux
  coverage:
    name: Code Coverage
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Setup Rust targets
        run: rustup target add wasm32-unknown-unknown wasm32-wasip1 wasm32-wasip2 || true
      - name: Install cargo-kiln
        run: cargo install --path cargo-kiln --force
      - name: Run coverage tests
        run: cargo-kiln coverage --html
        continue-on-error: true  # Coverage report generation is best-effort
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: target/llvm-cov/lcov.info
          fail_ci_if_error: false

  audit:
    name: Security Audit (${{ matrix.os }})
    strategy:
      fail-fast: false  # Don't stop all jobs if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # SR-73: pinned cargo-audit; fails on any vulnerability in Cargo.lock
      # (unmaintained/unsound warnings are reported, not gating).
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: Audit Cargo.lock
        run: cargo audit

  traceability:
    name: Traceability (rivet validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache rivet
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/rivet
          key: ${{ runner.os }}-rivet-v0.38.0
      # SR-75: pinned rivet; validation errors fail the job, warnings do not.
      - name: Install rivet
        run: |
          if ! command -v rivet >/dev/null 2>&1; then
            cargo install --locked --git https://github.com/pulseengine/rivet \
              --tag v0.38.0 --bin rivet rivet-cli
          fi
          rivet --version
      # Externals at the commits pinned in rivet.lock, so another repo's
      # push cannot turn this job red; moving a pin is an explicit PR.
      - name: Sync externals
        run: rivet sync --locked
      - name: Validate artifacts
        run: rivet validate

  vxworks_cross_build:
    name: VxWorks Cross-Compilation
    runs-on: ubuntu-latest
    # Real cross-compilation with VxWorks SDK — runs on push to main and manual triggers
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - name: Cache VxWorks SDK
        id: cache-vxworks-sdk
        uses: actions/cache@v6
        with:
          path: /opt/wrsdk
          key: vxworks-sdk-qemu-1.16.1
      - name: Download VxWorks SDK
        if: steps.cache-vxworks-sdk.outputs.cache-hit != 'true'
        run: |
          # VxWorks QEMU SDK — free under Non-Commercial License Agreement (NCLA)
          # https://forums.windriver.com/t/vxworks-software-development-kit-sdk/43
          mkdir -p /opt/wrsdk
          curl -fSL https://d13321s3lxgewa.cloudfront.net/wrsdk-vxworks7-qemu-1.16.1.tar.bz2 \
            -o /tmp/wrsdk.tar.bz2
          tar xjf /tmp/wrsdk.tar.bz2 -C /opt/wrsdk --strip-components=1
          rm /tmp/wrsdk.tar.bz2
      - name: Build kiln-platform for VxWorks (x86_64)
        shell: bash
        run: |
          # sdkenv.sh checks that /bin/sh is bash — change the default shell on Ubuntu
          sudo ln -sf /bin/bash /bin/sh
          # Source SDK environment
          . /opt/wrsdk/sdkenv.sh
          . "${WIND_SDK_HOME}/vxsdk/sysroot/usr/rust/rustenv.linux"
          export RUST_VSB_DIR="${WIND_CC_SYSROOT}"
          # Verify toolchain
          echo "Rust toolchain: $(rustc --version)"
          echo "Cargo: $(cargo --version)"
          # Build kiln-platform with VxWorks features — tests real linking
          cargo build \
            -p kiln-platform \
            --target x86_64-wrs-vxworks \
            --features "platform-vxworks,real-time,std"
          echo "VxWorks cross-compilation and linking succeeded"
  # SR-68: prove the static musl release build BEFORE a release. Builds `kiln`
  # exactly the way release.yml does (cargo-zigbuild), checks it is statically
  # linked, then runs it in a glibc-less Alpine container.
  musl_static_build:
    name: Static musl build (SR-68)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-musl
      - name: Install zig + cargo-zigbuild
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user ziglang==0.14.1
          cargo install cargo-zigbuild --version 0.23.4 --locked
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
      - name: Build kiln (x86_64-unknown-linux-musl)
        run: cargo zigbuild --release --target x86_64-unknown-linux-musl -p kilnd
      - name: Build kiln (aarch64-unknown-linux-musl, build-only)
        run: cargo zigbuild --release --target aarch64-unknown-linux-musl -p kilnd
      - name: Assert binaries are statically linked
        shell: bash
        run: |
          set -euo pipefail
          for T in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            for BIN in kiln kilnd; do
              DESC="$(file -L "target/${T}/release/${BIN}")"
              echo "$DESC"
              case "$DESC" in
                *"dynamically linked"*) echo "::error::${T}/${BIN} is dynamically linked"; exit 1 ;;
                *"statically linked"*|*"static-pie linked"*) ;;
                *) echo "::error::${T}/${BIN} is not reported as statically linked"; exit 1 ;;
              esac
            done
          done
          # A static binary has no dynamic loader dependencies. ldd exits
          # non-zero ("not a dynamic executable") for the x86_64 binary.
          if ldd target/x86_64-unknown-linux-musl/release/kiln; then
            echo "::error::ldd found dynamic dependencies"; exit 1
          fi
      - name: Run kiln in an Alpine container
        shell: bash
        run: |
          set -euo pipefail
          WANT="kiln $(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "kilnd") | .version')"
          # Smallest valid core module: (module (func (export "_start")))
          mkdir -p musl-smoke
          printf '\x00asm\x01\x00\x00\x00\x01\x04\x01\x60\x00\x00\x03\x02\x01\x00\x07\x0a\x01\x06_start\x00\x00\x0a\x04\x01\x02\x00\x0b' > musl-smoke/empty.wasm
          cp target/x86_64-unknown-linux-musl/release/kiln musl-smoke/kiln
          docker run --rm -v "$PWD/musl-smoke:/work:ro" -w /work \
            alpine:3.22.2@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412 \
            sh -euc '
              cat /etc/alpine-release
              ls /lib/ld-linux* 2>/dev/null && { echo "glibc loader present; not a glibc-less test"; exit 1; }
              GOT="$(./kiln --version)"
              echo "kiln --version -> $GOT"
              [ "$GOT" = "'"$WANT"'" ]
              ./kiln empty.wasm
              echo "kiln empty.wasm exit 0"
            '
