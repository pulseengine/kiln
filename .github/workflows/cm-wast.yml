name: Component Model WAST

# SR-93: the upstream Component Model WAST suite, run through meld-fused output
# on the kiln interpreter. The fused modules and meld's manifest are vendored
# (tests/component-model, regenerated by scripts/regen-cm-wast.sh), so this job
# needs no meld install. scripts/cm-wast-gate.sh compares the per-file verdicts
# with safety/cm-wast-baseline.txt in both directions: a regression fails, and
# so does an improvement that is not recorded in the baseline.
#
# Separate from wast-conformance.yml so its triggers stay as they are.

on:
  pull_request:
    paths:
      - 'kiln-runtime/**'
      - 'kiln-wasi/**'
      - 'kiln-foundation/**'
      - 'kiln-decoder/**'
      - 'kilnd/**'
      - 'cargo-kiln/**'
      - 'kiln-build-core/**'
      - 'tests/component-model/**'
      - 'safety/cm-wast-baseline.txt'
      - 'scripts/cm-wast-gate.sh'
      - 'varve.toml'
      - '.github/workflows/cm-wast.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cm-wast:
    name: Component Model WAST (meld-fused)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Vendored upstream tests match their checksums
        run: cd tests/component-model/upstream && sha256sum --quiet -c SHA256SUMS

      - name: Gate script fixtures
        run: bash scripts/cm-wast-gate-test.sh

      - name: Run the Component Model WAST suite
        # No `|| true`: the runner exits 0 whenever it wrote a report, so a
        # non-zero exit is a crash and must fail the job.
        run: |
          cargo run --release -p cargo-kiln -- testsuite --run-cm-wast \
            --cm-wast-report cm-wast-report.md
          test -f cm-wast-report.md

      - name: Gate on the verdict baseline
        run: bash scripts/cm-wast-gate.sh cm-wast-report.md safety/cm-wast-baseline.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cm-wast-report
          path: cm-wast-report.md
          if-no-files-found: ignore
