name: CodeQL

# Static security analysis (code scanning). Closes the "no code scanning" gap:
# the repo runs cargo-audit for dependency CVEs, but had no source-level analysis.
# CodeQL supports Rust; results appear under Security → Code scanning alerts.
#
# Note: the repo must have Code scanning enabled (Settings → Code security) for
# alerts to surface; this workflow uploads results regardless.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, off-peak, off the :00 mark.
    - cron: "27 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master; toolchain set in with:
        with:
          toolchain: stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: rust

      - name: Build (workspace libs + bins)
        run: cargo build --workspace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:rust"
