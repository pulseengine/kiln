name: Security Audit and Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Weekly clippy run, Tuesdays 03:00 UTC. cargo audit runs in ci.yml (required
    # Security Audit (<os>) jobs, exit status honoured).
    - cron: '0 3 * * 2'

env:
  CARGO_TERM_COLOR: always

jobs:
  safety-analysis:
    name: Safety Analysis with Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
      
      # SR-73: clippy's exit status is the verdict. Library and binary code
      # only (tests may unwrap); default features (the all-features build
      # does not compile, #557). The previous step parsed the output for the
      # word "denied", which clippy never prints, so it could not fail.
      - name: Run Safety-Critical Clippy
        run: |
          cargo clippy --workspace --lib --bins -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D clippy::unreachable

  dependency-review:
    name: Dependency Review
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          # Allow common open source licenses. Zlib added 2026-06-18: hashbrown
          # 0.16+ pulls foldhash (Zlib) as its default hasher (accepted via #325);
          # Zlib is permissive/OSI-approved/SPDX-listed/GPL-compatible.
          allow-licenses: MIT, Apache-2.0, BSD-3-Clause, ISC, MPL-2.0, Unlicense, Zlib
          # Exclude packages with undetected licenses that we've manually verified
          # Using PURL format: pkg:cargo/package@version
          # cap-primitives and winx (via cap-std, SR-107) are Apache-2.0 WITH
          # LLVM-exception; allowed for these crates only, as in deny.toml
          # (maintainer decision 2026-11-21).
          # The action splits this list on commas, as in its README.
          allow-dependencies-licenses: pkg:cargo/chrono, pkg:cargo/cap-primitives, pkg:cargo/winx