[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
    # Permissive data license of webpki-root-certs (Mozilla's CA bundle, via
    # reqwest in cargo-kiln only). Maintainer decision 2026-10-22, SR-73.
    "CDLA-Permissive-2.0",
]
# unlicensed = "deny" # Behavior is now deny by default with version = 2
# copyleft = "warn"   # Behavior is now deny by default unless allowed, with version = 2
confidence-threshold = 0.92
# cap-primitives and its Windows dependency winx (via cap-std in kiln-wasi:
# preopen directory-handle filesystem calls, SR-107) are Apache-2.0 WITH
# LLVM-exception only; the exception only adds permissions to Apache-2.0.
# Allowed for these crates alone. Maintainer decision 2026-11-21 (add cap-std).
exceptions = [
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "cap-primitives" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "winx" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow" # Workspaces often use this
highlight = "all"

# Example: Deny a specific problematic crate version
# [[bans.deny]]
# name = "some-crate"
# version = "=0.1.0"
# reason = "Known security issue in this specific version"

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# vulnerability = "deny" # Behavior is now deny by default with version = 2
# unmaintained = "warn" # Behavior is now deny by default with version = 2 (but see note below)
# unsound = "deny"       # Behavior is now deny by default with version = 2
yanked = "warn"
# notice = "warn"         # Behavior is now deny by default with version = 2
ignore = [
    # RUSTSEC-2026-0543: chrono is unmaintained. Only the build tooling uses it
    # (cargo-kiln, kiln-build-core: timestamp formatting) plus a kiln-intercept
    # dev-dependency; `cargo tree -p kilnd -e normal -i chrono` finds no match on
    # any of the 7 release targets. Removal from the tooling is SR-115.
    "RUSTSEC-2026-0543",
]
# severity-threshold = "medium" # Removed with version = 2

# Note: cargo-deny 0.18.2 re-added `advisories.unmaintained` as an option.
# If the project uses >= 0.18.2 and needs to warn for unmaintained instead of deny,
# this line can be uncommented: 
# unmaintained = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# SR-71 / #548 org policy: repos read their own inputs through rivet's YAML stack (rivet-yaml, git-only).
# rowan is rivet-yaml's own git dependency (pulseengine fork, rivet's workspace manifest), pulled in transitively.
allow-git = [
    "https://github.com/pulseengine/rivet",
    "https://github.com/pulseengine/rowan",
]
allow-registry = ["https://github.com/rust-lang/crates.io-index"] 