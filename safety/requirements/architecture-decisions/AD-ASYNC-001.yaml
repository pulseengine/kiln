artifacts:

  - id: AD-ASYNC-001
    type: design-decision
    title: The interpreter runs Component Model async through kiln-async, the same no_std scheduler the embedded path links; supersedes rfc46's 'no async in the interpreter'
    status: approved
    release: v0.10.0
    description: "DECISION (maintainer, option dialogue 2026-11-04; reworded 2026-11-18 after the 2026-11-17 requirements review with code comparison; maintainer chose the full rewording): kiln reuses kiln-async in the std interpreter rather than keeping the interpreter async-free or giving it a separate scheduler. (1) One scheduler: the interpreter's P3Builtin dispatch and kiln-builtins' __p3_* entry points shall delegate every scheduling decision (task and subtask creation, enqueue, wake, poll, cancel, event order) to one kiln-async Scheduler and shall hold no task queue, ready list or ordering state of their own. This covers cooperative threads: SR-84 moves the interpreter's CoopScheduler (kiln-runtime/src/stackless/coop_threads.rs, SR-82, v0.8.0) onto kiln-async's task table. (2) One event order: for the same fused module and the same sequence of host events, the interpreter and the kiln-builtins path shall produce the same event trace (task, waitable set, event code, payload, in order); the trace format and comparison are defined with SR-84. (3) Capacities: task, subtask, waitable-set and queue capacities shall come only from the bounds in the fused module's pulseengine:async-edges section (meld ADR-10); a module with async-lower imports and no valid section is refused at load, an operation past a bound traps, and the interpreter shall not raise a bound. (4) Acceptance: the acceptance pairs are meld's ADR-10 set at the meld commit SR-84 pins (19 pairs as of meld main 21536f0); a pair passes when the fused pair on kiln matches wasmtime's unfused exit status and output. Interpreter runs are evidence for the gale path, not a substitute: the kiln-builtins path also runs the pairs. STATE (2026-11-18): kiln-async implements the P3 intrinsics (kiln-async/src/intrinsics.rs), but no runtime crate links it; kiln-builtins' __p3_waitable_set_poll and __p3_waitable_set_drop refuse until SR-84 lands. kiln-async has 3 Kani harnesses (kiln-async/src/kani_proofs.rs) that no CI workflow runs (SR-103). rfc46-toolchain-architecture.md, section 'What Kiln Does NOT Do', still says async is not implemented in the interpreter; this decision takes precedence, and the section is updated in the PR that closes SR-84. Timing (2026-11-04 dialogue): SR-81 and SR-83 landed in v0.8.0; this wiring was planned for v0.9.0 because it waits on meld's edge section (ADR-10 step 3); maintainer decision 2026-11-21: moved to v0.10.0 with SR-84. Also decided there for meld: meld refuses an unfusable async edge at fuse time until its adapters land."
    tags: [p3, async, kiln-async, rfc46, adr-10, maintainer-decision]
    fields:
      alternatives-considered: "(1) Keep the interpreter async-free (rfc46 status quo): rejected, fused P3 async components could not run on the kiln CLI and the acceptance pairs could be checked only on gale or an emulator. (2) A separate std scheduler in the interpreter, of any capacity: rejected, two schedulers can order events differently so interpreter results would say nothing about gale, and it doubles maintenance."
      rationale: "One scheduler gives one event order on both paths, so interpreter runs of the acceptance pairs are evidence for the gale path. kiln-async is no_std, no alloc and forbid(unsafe); using it from the std interpreter shall not enable a feature that adds alloc or unsafe to it, and its Kani harnesses shall run in CI and pass (SR-103)."
    links:
      - type: satisfies
        target: SR-84
    provenance:
      created-by: ai
      model: claude-opus-5-5
      timestamp: 2026-11-18T17:20:00Z
