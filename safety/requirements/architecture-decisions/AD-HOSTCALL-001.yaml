artifacts:

  - id: AD-HOSTCALL-001
    type: design-decision
    title: "One host_call seam in the engine; every guest route to a served import goes through it, and steps S2-S4 grow that one function"
    status: implemented
    release: v0.8.0
    description: "For SR-102. S1 extracts host_call(instance_id, module, field, args) from call_wasi_function in kiln-runtime/src/stackless/engine.rs. call_wasi_function collects the args from the operand stack and calls it; the function-entry prelude used by call_ref and return_call calls it too, so host errors propagate on all routes, and an import with no link, builtin or host handler is an error instead of zero results. S2 moves return-area lowering into host_call keyed by the import's signature, S3 replaces the two buffer name lists with one policy, S4 validates return-area pointers and cabi_realloc results there. Later steps (typed dispatcher returns, link-time import resolution) are separate decisions."
    tags: [wasi, host-call, canonical-abi, refactor]
    fields:
      alternatives: "(1) Patch each route separately (the v0.7.3 approach for call_indirect): each fix leaves the other routes behind, which is how call_ref and return_call kept discarding errors after v0.7.3. (2) Rewrite the host boundary around typed WIT values in one change: closes everything at once but touches about 76 dispatcher arms in one diff, with no intermediate state to test against."
      rationale: "A single function every route calls makes the routes agree by construction, and each later step (lowering, buffer policy, pointer checks) is then made once. The steps land separately, each with tests that call the same import through call, call_indirect, call_ref and return_call, so a regression shows up as a route disagreeing."
    links:
      - type: satisfies
        target: SR-102
    provenance:
      created-by: ai
      model: claude-opus-5-5
      timestamp: 2026-11-13T19:00:00Z
