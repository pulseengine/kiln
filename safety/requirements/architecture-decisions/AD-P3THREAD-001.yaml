artifacts:

  - id: AD-P3THREAD-001
    type: design-decision
    title: "P3 cooperative threads run on the stackless trampoline: a thread is its parked frame stack, scheduled per call by a CoopScheduler with wasmtime's ready-queue rules"
    status: implemented
    release: v0.8.0
    description: "Implements SR-82. P3Builtin::from_import recognises the nine $root::[thread-*] built-ins ($N suffix stripped by kiln_foundation::split_instance_suffix). The three host-import dispatch sites in kiln-runtime/src/stackless/engine.rs (direct call, call_indirect to an import, an import reached as a trampoline target) return ExecutionOutcome::ThreadBuiltin with the caller's SuspendedFrame instead of running the built-in, because a switch moves the whole frame stack, which only the trampoline in StacklessEngine::execute owns. There one execute() call is one synchronous task: a CoopScheduler (kiln-runtime/src/stackless/coop_threads.rs) is created on the first thread built-in and holds every thread that is not running as Continuation::Start (not started: start function, arg) or Continuation::Resume (its frames, moved, plus the 0 its parking built-in returns). Rules follow wasmtime's concurrent.rs: per-owner handle tables with the implicit thread as handle 1; one FIFO ready queue (resume-later and yield push to the back); *-then-resume names the next thread, *-then-promote only if it is ready; with nothing to run a yield returns 0 and a suspend, or an explicit thread's exit, traps 'cannot block a synchronous task before returning'. The owner is the import map entry's component (checked against the import as in SR-81); without a map an unsuffixed import is owner 0 and a suffixed one is refused. new-indirect's fn_idx indexes the table exported as __meld_thread_table (cross-checked with the map's thread_table); a null element or a start function not of type (i32) -> () traps. The import's declared core type must be the producer ABI's. The implicit thread returning while other threads are ready is refused. wasi-threads and shared-everything built-ins are not recognised and stay unresolved (E21A0)."
    tags: [p3, threads, component-model, issue-620]
    fields:
      alternatives: "(1) A Rust thread or fiber per guest thread: the interpreter would need a native stack per thread and a sync handoff, against the stackless design and unavailable to no_std. (2) Run each thread to completion at new-indirect or resume-later: wrong results whenever a thread yields or suspends (t3 returns 2 only if main runs again between counter=1 and counter=2). (3) Scheduler state on StacklessEngine across calls: threads would outlive the task that created them and a later call would see handles of an earlier one; kiln has no event loop to run them. (4) Drop ready threads silently when the export returns: reports success for work that never ran."
      rationale: "The trampoline already keeps a call stack on the heap (pending_frames plus SuspendedFrame), so parking a thread is moving that Vec and resuming it is moving it back; nothing is copied and Rust stack use stays O(1). Following wasmtime's queue and trap rules makes the seven #620 oracle programs give wasmtime's results (7, 3, 2, trap, 9, trap, 36), measured on wasmtime 50.0.1 and kiln. Keeping the scheduler per call keeps the call's semantics a synchronous task, which is how kiln invokes exports."
    links:
      - type: satisfies
        target: SR-82
    provenance:
      created-by: ai
      model: claude-opus-5-5
      timestamp: 2026-11-13T20:30:00Z
