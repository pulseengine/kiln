artifacts:

  - id: AD-PROOFLEDGER-001
    type: design-decision
    title: A committed proof ledger lists every Kani harness and every narrowing site by file, function and kind; a per-PR job checks it, runs the harnesses that verify, and proves it can fail
    status: implemented
    release: v0.10.0
    description: "Implements SR-121. safety/verification/proof-ledger.toml has one [[harness]] row per Kani harness marker (#[kani::proof], cfg_attr(kani, kani::proof), proof_for_contract) with a status (verified, not-compiled, feature-gated, unbounded, wrong-config); a verified row names the function it proves (proves) and the product entry path that calls it (entry_path). It has one [[narrowing]] row per (file, function, kind) with a count, for kinds assume (kani::assume), unwind (kani::unwind), stub (kani::stub), and the Verus kinds external_body and admit. [[floor]] rows list, per package, the harnesses that must verify. cargo-kiln proof-ledger check (kiln-build-core/src/proof_ledger.rs) scans the sources and fails when a harness or narrowing site has no matching row, a row is stale, a count differs, a verified row lacks proves or entry_path, a floor harness is missing from or not SUCCESSFUL in its cargo kani log, or (given the base branch's ledger) any narrowing count or the total grows. .github/workflows/proofs.yml runs on every PR and push to main: the static check against the base ledger, cargo kani on each floor (kiln-async: 3 harnesses; kiln-builtins: proofs::dispatch_import_returns_zero_without_platform), the check again with the logs, a mutation control (safety/verification/mutations/kiln-async-remove-keeps-generation.patch removes the generation bump in TaskTable::remove; the ABA harness must report FAILED with 'assertion failed: t.state_of(old).is_none()') and a ledger control (a planted kani::assume must fail the check). Kani is pinned to 0.68.0 (CBMC 6.11), the version the baseline was measured with on 2026-11-25; the 0.63.0 pin was never exercised by a run that reached a harness. The kiln-build-core ASIL-D profile no longer passes --enable-unstable, which 0.68 rejects."
    tags: [kani, verus, proofs, ledger, ci, north-star-o3]
    fields:
      alternatives: "(1) Key narrowing rows by line number: every unrelated edit above a site would churn the ledger and hide real growth in noise. (2) Count assumptions per crate only: a moved assumption and a new one look the same. (3) Run every harness on every PR: 4 of 110 harness markers verify on 2026-11-25; the rest do not compile, need features, or never terminate (the kiln-builtins cabi_realloc CAS loop has no unwind bound and ran 17 h), so a full run is either always red or must be allowed to fail, which is no gate. The floors pin what verifies today and the ledger records why each other harness does not. (4) A Python checker: no new Python; the check is a cargo-kiln subcommand like kani-verify."
      rationale: "The ledger turns 'the proofs pass' into a statement with a denominator: which harnesses run, which do not and why, and which input ranges are narrowed. Growth is refused mechanically, so a new assumption needs a visible maintainer decision (the check is meant to become required, and only an admin bypass can merge past it). The mutation control shows the per-PR job can go red for a broken property, not only for a missing tool. Known gap recorded in the ledger: the 3 kiln-async harnesses have no product entry path until SR-84 wires kiln-async into kiln-builtins."
    links:
      - type: satisfies
        target: SR-121
    provenance:
      created-by: ai
      model: claude-opus-5-5
      timestamp: 2026-11-25T22:30:00Z
