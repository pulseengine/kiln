artifacts:

  - id: AD-WASIFS-003
    type: design-decision
    title: "kiln-wasi has one WASI dispatch path: core ABI via HostImportHandler -> dispatch_core"
    status: implemented
    release: v0.8.0
    description: "WasiDispatcher exposes WASI only through its HostImportHandler impl (call_import -> dispatch_core), which takes raw core values plus the instance's linear memory and maps host io::ErrorKind to the WIT wasi:filesystem error-code via fs_error_code. The value-ABI WasiDispatcher::dispatch was deleted in #641 (SR-99)."
    tags: [kiln-wasi, wasi-filesystem, dead-code]
    fields:
      rationale: "The value-ABI dispatch had no non-test caller and had drifted: wrong WIT error-code indices (2/17), unimplemented open-at/stat, and it did not compile with wasi-sockets. Keeping two paths doubled every sandbox fix (SR-95 needed both); one path means one place to verify."
    links:
      - type: satisfies
        target: SR-99
    provenance:
      created-by: ai
      timestamp: 2026-11-08T06:53:45Z
