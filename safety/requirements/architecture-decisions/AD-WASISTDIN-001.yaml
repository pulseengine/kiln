artifacts:

  - id: AD-WASISTDIN-001
    type: design-decision
    title: wasi:cli/stdin streams read on demand from one injectable host source; read and blocking-read both wait for data or end-of-input
    status: implemented
    release: v0.9.0
    description: "Implements SR-127 (#712). kiln-wasi WasiDispatcher holds stdin_source: Box<dyn std::io::Read + Send + Sync> (std::io::stdin() by default, replaced through set_stdin_source) and the set of handles get-stdin returned; drop removes a handle. read and blocking-read on such a handle call the source once (retrying on Interrupted) for at most min(len, cabi_realloc'd buffer) bytes and return what it gave; zero bytes from the source is stream-error::closed; len 0 returns an empty ok list without a buffer. A missing guest buffer or a host read error fails the call. Nothing is buffered ahead of the guest's reads. Tests: kiln-wasi sr127_stdin, kilnd/tests/stdin_tests.rs (echo guest)."
    tags: [wasi, wasip2, cli, stdin, streams]
    fields:
      alternatives: "(1) Read all of stdin at startup into a buffer: simple, but holds unbounded input in memory and blocks before the guest runs. (2) Make read non-blocking with a host poller thread: matches wasmtime's async model, but kiln's streams are synchronous (Pollable::AlwaysReady) and a thread adds state for no measured need. (3) Map a host read error to stream-error::last-operation-failed: needs an error resource kiln does not create yet."
      rationale: "One on-demand source keeps memory bounded and lets embedders and tests supply stdin; returning short reads as-is never reports ok(empty) followed by a spurious closed."
    links:
      - type: satisfies
        target: SR-127
    provenance:
      created-by: ai
      model: claude-opus-5-5
      timestamp: 2026-11-22T06:10:00Z
