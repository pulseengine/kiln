artifacts:

  - id: SR-102
    type: requirement
    title: Every route from guest code to a host import goes through one host call that allocates, lowers and validates the same way
    status: verified
    release: v0.8.0
    description: "Maintainer decision 2026-11-13 (host-call refactor S1-S4). MEASURED on main fa16dc8d: kiln reaches host imports through several routes in kiln-runtime/src/stackless/engine.rs: the call arm and call_indirect through call_wasi_function, the function-entry prelude used by call_ref and return_call, and dispatch_canon_lowered. They disagree. call_ref and return_call discard the host handler's error and return zero results, with no cabi_realloc buffer allocated. On the call_wasi_function route, results the dispatcher returns as core values are pushed as an operand instead of being written to the return area. Which functions get a guest-owned buffer is decided by two separate name lists. No route checks the alignment or range of a return-area pointer or a cabi_realloc result. REQUIRED: (S1) call, call_indirect, call_ref and return_call reach a served import through one host_call that propagates host errors, and an import nothing serves is an error, never zero results; (S2) results returned as core values are written to the return area by that host_call per the import's signature; (S3) one policy decides which calls get a fresh cabi_realloc buffer and allocation failures propagate; (S4) return-area pointers and cabi_realloc results are checked for alignment and bounds and a bad one traps. Verified by: kilnd tests that call the same WASI function through call, call_indirect, call_ref and return_call and get the same allocation count, return-area contents and trap behaviour; a stray-operand test; the WASI probe differential against wasmtime with no outcome moving away from wasmtime; the WAST spec suite pass set unchanged."
    tags: [wasi, host-call, canonical-abi, refactor]
    links:
      - type: refines
        target: SR-38
    provenance:
      created-by: ai
      model: claude-opus-5-5
      timestamp: 2026-11-13T19:00:00Z
