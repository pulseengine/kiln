artifacts:

  - id: SR-103
    type: requirement
    title: Kani proofs run and fail visibly, and no security check reports success without auditing
    status: proposed
    release: v0.8.0
    description: "Gate-potency sweep, 2026-11-13; drafted on the maintainer's request, not yet approved. MEASURED on main 012c738e. (1) .github/workflows/kani-verification.yml runs only on a weekly schedule and by hand; its last 6 runs (2026-10-04 to 2026-11-08, latest 42464203663) failed. No harness ran in any of them: every job fails installing Kani because tool-versions.yaml:92's install_command 'cargo install --locked --version 0.63.0 kani-verifier && cargo kani setup' reaches cargo with '&&' as a package name ('invalid character `&` in package name'), and Miri is not available on the stable channel. kiln-format/src/verify.rs:7-10 records that its Kani harnesses do not compile (stale `state` import). A failing run reaches no one. (2) .github/workflows/security-audit.yml runs 'cargo audit --json' with continue-on-error, then counts vulnerabilities with jq on '.advisory.severity'. cargo-audit 0.22.1's JSON advisory objects have no 'severity' key (they carry 'cvss'), so the count is always 0 and the job passes whatever the audit found. The required audit in ci.yml (cargo audit, exit status honoured) is unaffected: it failed #662 on RUSTSEC-2026-0538. REQUIRED: the Kani tool install runs each command of a tool's install step as a command, not as cargo arguments; every kiln Kani harness compiles and runs under 'cargo kani', or is deleted with its claim; a failed Kani run is reported where the maintainer sees it (a required or PR-visible check, or an issue opened on failure); security-audit.yml either fails on a vulnerability cargo audit reports or is removed. Verified by: a Kani run with every harness executed and its result in the log; a negative control in which a deliberately false harness fails the run and produces the report; a lockfile carrying a known advisory (e.g. RUSTSEC-2020-0071) failing the remaining audit job."
    tags: [ci, kani, formal-verification, supply-chain, gate-potency]
    provenance:
      created-by: ai
      model: claude-opus-5-5
      timestamp: 2026-11-13T19:45:00Z
