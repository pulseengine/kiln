artifacts:

  - id: SR-126
    type: requirement
    title: kilnd --dir accepts HOST::GUEST and exposes the host directory to the guest under the GUEST name, as wasmtime does
    status: proposed
    description: "Gap found while running sieve's fused component on kiln (2026-11-20). wasmtime 50.0.1 'run --help' documents '--dir <HOST_DIR[::GUEST_DIR]>': HOST alone preopens the host directory under the same name, HOST::GUEST preopens HOST under the name GUEST. kilnd main 66e933a1 (by reading, not yet measured): '--dir'/'--wasi-fs' pushes the argument unchanged into wasi_fs_paths; dispatcher.add_preopen(path) registers the preopen with the guest name equal to the host path; there is no '::' split, so 'a::b' is treated as one host path; and kilnd discards add_preopen's Result ('let _ =', kilnd/src/lib.rs ~718 and ~959), so a preopen that fails to register is silently missing. REQUIRED: '--dir HOST::GUEST' preopens HOST with guest name GUEST; '--dir HOST' keeps today's behaviour; the allow-list (SR-50) and containment checks apply to HOST, never to the guest name; a preopen that cannot be registered (missing host directory, empty HOST or GUEST) ends kilnd with an error naming the argument instead of running without it. Verified by: (1) kilnd tests: a guest reading GUEST/file sees HOST/file; get-directories returns GUEST; '..' or an absolute path under GUEST cannot reach outside HOST; a missing HOST is refused at startup; (2) the same component run with the same '--dir' arguments on kiln and wasmtime 50.0.1 gives the same stdout and exit status. Release not assigned; maintainer decision."
    tags: [wasi, wasip2, filesystem, cli, preopen, path-mapping]
    links:
      - type: refines
        target: SR-50
    provenance:
      created-by: ai
      model: claude-opus-5-5
      timestamp: 2026-11-20T16:00:00Z
