artifacts:
- id: SR-29
  type: requirement
  title: Component multi-core instantiation links cross-core user imports (sibling-module function/memory)
  status: proposed
  description: "SUPERSEDED-BY-ARCHITECTURE? — measurement for the maintainer, 2026-10-14. Original scope: in kilnd's DIRECT multi-core component instantiation (kiln-component), link a core module's import to the exporting sibling core instance (cross-core user function/memory). Issue #375. Since RFC #46 kiln refuses Component-Model components outright ('lower it first with meld fuse'); meld fuses all core modules of a component into ONE core module, so cross-core linking is resolved by meld at build time and the direct path this requirement targets is no longer reachable from the product. MEASURED on the product path: all 17 components of the released pulseengine/wasm-component-examples v0.5.0 (each 4 core modules, except p3_cli) fuse with meld 0.61.0 --emit-manifest; the 5 command components (hello_c_cli, hello_cpp_cli, hello_go, hello_rust, datetime) run on kiln (main d9e66fa0) with exit 0 and stdout identical to wasmtime 42.0.1 on the original component; calculator matches (usage text, exit 1); the 9 library/P3 components are refused by both engines for having no run entry. So multi-core components DO link and run on the supported path. Open question for the maintainer: retire SR-29 (direct path unreachable by design) or re-scope it to the fused path, which these measurements already cover. Not marked implemented: its title describes the direct instantiation path, which was not changed. Separate defect found during this measurement: unresolved imports are accepted at instantiation (SR-65, #527)."
  tags:
  - component-model
  - instantiation
  - multicore
  - linking
  fields:
    upstream-ref: https://github.com/pulseengine/kiln/issues/375
  provenance:
    created-by: ai
    model: claude-opus-4-8
    timestamp: 2026-07-02T07:40:03Z
  release: v0.6.0
