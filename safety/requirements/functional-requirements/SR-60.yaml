artifacts:

  - id: SR-60
    type: requirement
    title: kilnd lowers component-typed arguments (list/record/string) for an invoked export
    status: proposed
    description: "DECIDED (meld#400, 2026-09-09): kiln consumes a SIGNATURE MANIFEST custom section (option B), not a synthesized component-type section (option A). meld established that option A rested on a false premise — 'wasm-tools component new' CONSUMES the component-type section, so meld never receives one and there is nothing to preserve; A would mean SYNTHESIZING a section asserting 'wrap this core module and you get this world' about an artifact deliberately never re-componentized, and a subtly wrong one VALIDATES. MEASUREMENT kiln supplied as the deciding input: across every wasm component pulseengine currently releases, the EXPORTED interfaces carry ZERO resources/handles — scry-3.3.0 (records/lists/strings/options/enums/variants/result), witness-reporter-v0.43.0, wsc-component; wsc-cli is a wasi:cli command component; jess's falcon cascade is flat f32 records. Resources appear only in the wasi:io IMPORTS, which kiln never lowers arguments for. So A was TRACTABLE for the current inventory — B was chosen for the cross-check property, not to dodge encoding difficulty. RATIONALE: A supplies a WIT tree from which kiln must RE-DERIVE the canonical ABI, and the Canonical ABI passes garbage rather than erroring when that derivation is wrong (jess hit this assuming pointer-in for mixer as well as rate). Silent-wrong re-derivation is the exact failure family kiln removed across SR-44/SR-45/SR-57. B carries the flattened core signature meld actually emitted, so kiln checks its lowering instead of trusting it. AGREED SHAPE, per exported canonical name: (1) wit — structural param/result type tree to parse --arg against and lower from; (2) core — the flattened core signature meld emitted, as the cross-check (disagreement = fail loud, do not call); (3) calling_shape — direct vs pointer-in vs pointer-out (three shapes across five exports of one component, driven by the flattening limit); (4) return_area — SIZE IN BYTES AND FIELD LAYOUT, a hard requirement not a nice-to-have; (5) version on the manifest so kiln can refuse an unknown shape. Field (4) also unblocks kiln#505 independently of argument lowering: every Canonical-ABI export returns an i32 pointer into the return area, so v0.5.0 --invoke prints a constant address (i32 9488 across all inputs) and jess had to label their kiln check an execution check rather than a value differential. With return_area kiln dereferences and reports the actual values, making it a fourth differential engine over the shipped core. Blocked until meld ships the manifest; kiln offered to review a draft against scry (list<u8> + record, needs guest allocation) and the falcon cascade (flat f32, pointer returns), which cover both difficulty classes. Relates to SR-59, SR-58, kiln#505. Issue #480, meld#400."
    tags: [kilnd, invoke, canonical-abi, component, blocked-external]
    provenance:
      created-by: ai
      model: claude-opus-5
      timestamp: 2026-09-07T06:59:31Z
    release: v0.6.0
