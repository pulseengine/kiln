artifacts:

  - id: SR-60
    type: requirement
    title: kilnd lowers component-typed arguments (list/record/string) for an invoked export
    status: proposed
    description: "SHAPE AGREED with meld (meld#400, 2026-09-18). Manifest fields kiln's reader keys on: export, wit, core, flat_param_count, needs{memory,realloc}, memory, realloc, post_return, return_area{size,align,layout[(offset,field,size)]}, version. NOTE calling_shape was DROPPED: meld proved it is NOT derivable from core — f(x:u32)->u32 and rate#tick(18 x f32)->record both flatten to (i32)->(i32) under the reference implementation, so only the WIT says whether that i32 is a value or a pointer. Replaced by #378's existing vocabulary (flat_param_count + needs), rather than inventing terms. REALLOC DECISION: option (i) — meld names each lift's realloc per export; NOT (ii) one module-level <prefix>_realloc. Deciding fact: the fused falcon cascade has FIVE bump arenas (falcon_cm_rt::STORE, 8192 B each, one per component) and exports exactly one realloc, attributed to mixer — the one stage whose export does not need it; the reallocs named by the position/attitude/rate lifts are NOT exported. Under (ii) a single module-level realloc must pick an arena, and allocating rate#tick's arguments from mixer's arena hands the callee memory its own allocator does not own, with nothing trapping — the Canonical ABI passes garbage rather than erroring. (ii) acceptable later ONLY as a real unification (one arena genuinely serving every export), not a name re-pointed at one of five. KILN READER CONTRACT (committed on the thread): realloc=null + needs.realloc=true -> REFUSE to invoke, name the export, no fallback to a similar-looking exported realloc; core disagreeing with what kiln derives from wit -> fail loud, do not call; unknown major version -> refuse the whole manifest, no best-effort parse; post_return called after reading the return area (an 8192 B bump arena leaks in a handful of calls otherwise). return_area.layout is top-level only for now — sufficient for kiln#505/SR-61 (falcon stages return flat f32 records); scry's nested result<...> layout deferred, and kiln refuses to decode below the level meld describes rather than inferring. MELD'S VERIFICATION (why the manifest is trustworthy): core read back from emitted bytes, the Canonical ABI reference implementation applied to wit, and the guest's __RET_AREA symbol from the linking section — three sources sharing no code, all agreeing on all five falcon stages, plus a negative control (mixer's type rewritten -> core_equals_spec=False). scry's 128-byte return area rests on the spec alone and stays visibly single-sourced. SEQUENCING offered to meld: core+flat_param_count+needs+return_area on the falcon stages alone unblocks SR-61 and the SR-59 pointer hole; scry nested layout and realloc resolution (meld finding 4 — realloc was name-matched, must be resolved through fusion) follow. Relates to SR-59, SR-61, kiln#505, bytecodealliance/rfcs#46 (meld confirmed the RFC leaves the 'shape not known ahead of time' dynamic-runtime case open; this manifest fills it). Issue #480, meld#400."
    tags: [kilnd, invoke, canonical-abi, component, blocked-external]
    provenance:
      created-by: ai
      model: claude-opus-5
      timestamp: 2026-09-07T06:59:31Z
    release: v0.6.0
