artifacts:

  - id: SR-61
    type: requirement
    title: kilnd dereferences the Canonical-ABI return area and reports values, not the pointer
    status: verified
    description: "IMPLEMENTED (PR on branch feat/sr-61-return-area, on top of #517). REPORTED BY A CONSUMER (kiln#505, jess): v0.5.0 --invoke printed the i32 a Canonical-ABI export returns, which for a result returned through memory is the ADDRESS of the return area — mixer#mix returned i32 9488 for every input, so an engine differential on it proved nothing about the arithmetic. FIX: when meld's signature manifest gives the invoked export a return_area, kilnd (1) requires the export to return exactly one i32 address, (2) checks it against the manifest alignment and the bounds of the manifest-named memory, (3) reads return_area.size bytes, (4) decodes each layout field by the TYPE from wit.result (the layout itself carries names and sizes only), matched by name and order, (5) calls post_return with the core results AFTER copying the bytes, and only then (6) prints 'name: <wit-type> <value>' per field. Every disagreement is refused, never guessed: non-record result, compound field (meld describes only the top level), layout/WIT name or size mismatch, field overrunning the area, wrong buffer length, invalid char, misaligned or out-of-bounds address, missing memory. MEASURED on the binary, cross-engine: relay falcon-v1.140.0 mixer component fused by meld 0.61.0 --emit-manifest; kiln on the fused core vs wasmtime 42.0.1 on the original component, four inputs ((1,0,0,0.5) (0,1,0,0.9) (0.25,0.25,0.25,0.125) (-0.3,0.7,0.05,0.6)): all 16 m1..m4 values identical, including 0.875 and 0.49999988, and the values now vary with input where v0.5.0 printed a constant. falcon-cascade observer#read-state (84-byte, 21 fields incl. u8 at padded offset 72): all 21 fields identical to wasmtime. TESTS: kiln-decoder signature_manifest (9 decode tests, each refusal pinned to its error variant) and kilnd/tests/return_area_tests.rs (6: values track inputs, pointer not reported, post_return called with the pointer and a trapping post_return fails the run, undecodable/misaligned/out-of-bounds refused). NOT COVERED: results with compound fields (nested record/option/list/string) — refused with the field named; asked meld to add per-field types to the layout. controller#step still needs SR-60 lowering for its 26 flattened args. Relates to SR-60, SR-63, SR-59, meld#400. Issue #505."
    tags: [kilnd, invoke, canonical-abi, return-area, differential-oracle]
    provenance:
      created-by: ai
      model: claude-opus-5
      timestamp: 2026-09-09T15:22:23Z
    release: v0.6.0
    fields:
      verification-evidence: "2026-10-15 on the release binary at main 60a812eb: relay falcon-v1.140.0 mixer fused by meld 0.62.0 --emit-manifest; kiln --invoke mixer@0.11.0#mix vs wasmtime 42.0.1 on the original component for (1,0,0,0.5) (0,1,0,0.9) (0.25,0.25,0.25,0.125) (-0.3,0.7,0.05,0.6): all 16 m1..m4 values identical (incl. 0.875, 0.49999988). observer#read-state decodes the 84-byte, 21-field record. return_area_tests (6) + decoder signature_manifest tests (15) green."
