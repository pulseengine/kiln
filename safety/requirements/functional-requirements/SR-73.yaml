artifacts:

  - id: SR-73
    type: requirement
    title: "The required clippy checks can fail: they run without continue-on-error and block a PR on a finding"
    status: approved
    release: v0.7.0
    description: "Measured 2026-10-21 on main bc5a5194: the required status check 'Safety Analysis with Clippy' (security-audit.yml 'Run Safety-Critical Clippy') and ci.yml's 'Run clippy checks' both run with continue-on-error: true, so a required check passes whatever clippy reports — a vacuous merge gate. Maintainer decision 2026-10-21: make them blocking in v0.7.0, alongside SR-32. Fix or narrowly allow (with a justified #[allow] at the site, not a blanket workspace allow) what they flag, then remove continue-on-error so the check fails on a new finding. Verified by: neither step has continue-on-error, and a PR introducing a denied lint (e.g. an unwrap in a lib crate covered by the safety lints) shows the required check red."
    tags: [ci, clippy, merge-gate, vacuous-gate]
    links:
      - type: derives-from
        target: SR-28
    provenance:
      created-by: ai
      model: claude-opus-5-5
      timestamp: 2026-10-21T04:18:36Z
