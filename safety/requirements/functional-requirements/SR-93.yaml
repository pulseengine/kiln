artifacts:

  - id: SR-93
    type: requirement
    title: The upstream Component Model WAST suite runs through meld and kiln in CI, with a ratcheted baseline as the P3 oracle
    status: implemented
    release: v0.8.0
    description: "Issue #627, reshaped by the Bytecode Alliance Plumbers Summit component-model update (2026-11): upstream now carries about 26,000 lines of component WAST written from the spec. MEASURED 2026-11-05: WebAssembly/component-model test/ at c818a1925e (2026-11-03) has 78 .wast files: async 47 (including reentrance.wast, cancel-subtask.wast, drop-subtask.wast, deadlock.wast, forward.wast), validation 15, values 8, linking 4, resources 3, binary 1; test/nyi.txt lists 4 files not yet implemented by the reference (validation/kebab, values/post-return, async/big-interleaving-test, async/forward). meld v0.67.0 refuses component extern names carrying implements, version-suffix or external-id (meld-core/src/parser.rs plain_extern_name) and maps map<K,V> to its P3Async placeholder kind, so the CM 0.3.1 features fail loud at fuse time today. kiln has no component-WAST runner. REQUIRED: a runner that takes each upstream component WAST, fuses each component with meld and executes the assertions on the kiln interpreter; a pinned upstream commit; a ratcheted baseline of failing files (new failure fails, a baselined file that starts passing must be removed), so unsupported features are listed rather than skipped; spec-derived WAST is written only for features upstream does not yet cover, each recording the spec commit it came from and checked against the pinned wasmtime. Verified by: the runner in CI on every runtime- or meld-pin-affecting PR, a committed baseline, and negative controls as in SR-92. This suite is the acceptance oracle for SR-82 (cooperative threads) and SR-84 (async edges), including re-entrance. INTERFACE WITH MELD (agreed with meld 2026-11-05, meld main 092772b): meld has no WAST mode today and its component-model pin is deb0b0ac35 (2025-05-19), which predates reentrance.wast. Under meld #562 meld bumps the pin to c818a1925e and adds a driver that parses each WAST, fuses every top-level component, ratchets fuse versus loud refusal per file against its own baseline, and writes each fused.wasm with a manifest (WAST path, component index, meld version). kiln's runner consumes those outputs and owns assert_return and assert_trap. A file meld refuses to fuse is recorded in kiln's baseline as refused-at-fuse, not as a kiln failure."
    tags: [component-model, wast, conformance, p3, meld, issue-627]
    provenance:
      created-by: ai
      model: claude-opus-5-5
      timestamp: 2026-11-05T21:49:23Z
