artifacts:

  - id: SR-93
    type: requirement
    title: The upstream Component Model WAST suite runs through meld and kiln in CI, with a ratcheted baseline as the P3 oracle
    status: proposed
    release: v0.8.0
    description: "Issue #627, reshaped by the Bytecode Alliance Plumbers Summit component-model update (2026-11): upstream now carries about 26,000 lines of component WAST written from the spec. MEASURED 2026-11-05: WebAssembly/component-model test/ at c818a1925e (2026-11-03) has 78 .wast files: async 47 (including reentrance.wast, cancel-subtask.wast, drop-subtask.wast, deadlock.wast, forward.wast), validation 15, values 8, linking 4, resources 3, binary 1; test/nyi.txt lists 4 files not yet implemented by the reference (validation/kebab, values/post-return, async/big-interleaving-test, async/forward). meld v0.67.0 refuses component extern names carrying implements, version-suffix or external-id (meld-core/src/parser.rs plain_extern_name) and maps map<K,V> to its P3Async placeholder kind, so the CM 0.3.1 features fail loud at fuse time today. kiln has no component-WAST runner. REQUIRED: a runner that takes each upstream component WAST, fuses each component with meld and executes the assertions on the kiln interpreter; a pinned upstream commit; a ratcheted baseline of failing files (new failure fails, a baselined file that starts passing must be removed), so unsupported features are listed rather than skipped; spec-derived WAST is written only for features upstream does not yet cover, each recording the spec commit it came from and checked against the pinned wasmtime. Verified by: the runner in CI on every runtime- or meld-pin-affecting PR, a committed baseline, and negative controls as in SR-92. This suite is the acceptance oracle for SR-82 (cooperative threads) and SR-84 (async edges), including re-entrance."
    tags: [component-model, wast, conformance, p3, meld, issue-627]
    provenance:
      created-by: ai
      model: claude-opus-5-5
      timestamp: 2026-11-05T21:49:23Z
