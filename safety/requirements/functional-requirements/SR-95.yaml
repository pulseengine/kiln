artifacts:

  - id: SR-95
    type: requirement
    title: unlink-file-at removes a symlink itself on both dispatch paths, never the file it points to
    status: verified
    release: v0.8.0
    description: "Wasmtime advisory review, 2026-11-05; maintainer chose it for v0.8.0 on 2026-11-06. MEASURED on main 2b8e4b81: the value-ABI handler for [method]descriptor.unlink-file-at (kiln-wasi/src/dispatcher.rs:1913-1945) authorises the path with resolve_and_authorize, which follows the final symlink, then calls std::fs::remove_file on the resolved path, so unlinking a link inside the preopen deletes its in-sandbox target instead. The core-ABI path (dispatcher.rs:3704-3712) already uses resolve_and_authorize_nofollow and removes the link. Targets outside the preopen are still refused by the containment check, so this is a wrong-file deletion inside the sandbox, not an escape. REQUIRED: both dispatch paths authorise unlink-file-at with the no-follow resolver and remove the directory entry named, and both refuse a directory with is-directory. Verified by: a test on each path that creates file F and symlink L->F in a preopen, unlinks L, and asserts L is gone and F still exists with its contents. UPDATE 2026-11-08 (SR-99, #641): the value-ABI dispatch path was deleted as dead code, so 'both dispatch paths' now means the single core-ABI path (dispatch_core), which uses the no-follow resolver and is verified by the sr72 unlink tests."
    tags: [wasi, filesystem, sandbox, symlink, cve-followup]
    provenance:
      created-by: ai
      model: claude-opus-5-5
      timestamp: 2026-11-06T08:58:17Z
