artifacts:

  - id: SR-96
    type: requirement
    title: Trailing-slash paths cannot leave the WASI sandbox, and tests prove it on both dispatch paths
    status: approved
    release: v0.8.0
    description: "Wasmtime advisory review, 2026-11-05; maintainer chose it for v0.8.0 on 2026-11-06. Wasmtime fixed sandbox escapes where a trailing slash on a guest path changed which component was resolved. kiln is not affected by reasoning only: resolve_and_authorize and resolve_and_authorize_nofollow (kiln-wasi/src/dispatcher.rs, sandbox gate ~986-1100) rebuild the path as real_parent.join(file_name), which drops a trailing slash, and refuse symlink targets that are absolute or contain '..'. No test exercises this. REQUIRED: regression tests, on the value and core dispatch paths, for open-at, stat-at, unlink-file-at, remove-directory-at, create-directory-at, rename-at and symlink-at with paths 'link/', 'link/.', 'dir/../link/' and 'file/', where link is a symlink to a directory outside the preopen: each call is refused or acts only inside the preopen, and a trailing slash on a non-directory returns not-directory. Verified by: those tests passing in CI."
    tags: [wasi, filesystem, sandbox, cve-followup, regression-test]
    provenance:
      created-by: ai
      model: claude-opus-5-5
      timestamp: 2026-11-06T08:58:17Z
