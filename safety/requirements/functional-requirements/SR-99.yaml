artifacts:

  - id: SR-99
    type: requirement
    title: "kiln-wasi value-ABI dispatch: either return correct wasi:filesystem error codes or be removed"
    status: verified
    release: v0.8.0
    description: "Measured on main 6cb2b858 (kiln-wasi/src/dispatcher.rs). WasiDispatcher::dispatch (value ABI) has NO non-test caller in the workspace: kilnd reaches WASI only via HostImportHandler::call_import -> dispatch_core, which already maps io::ErrorKind through fs_error_code. The value path's filesystem arms are wrong against WIT wasi:filesystem error-code: stat, readdir and unlink-file-at return U32(2) commented ENOENT (index 2 is 'already'; no-entry is 20); create-directory-at returns U32(17) commented EEXIST (17 is 'message-size'; exist is 7); every host failure collapses to one code regardless of ErrorKind. Also: open-at ignores path-flags/open-flags and always returns Ok without opening; a bad descriptor traps (Rust Err) instead of returning bad-descriptor; stat returns a {type,size} record, not descriptor-stat; write-via-stream returns the descriptor handle as the stream handle. Acceptance (maintainer chooses one): (A) delete the value-ABI filesystem arms (or dispatch entirely) per the no-dead-code rule, keeping dispatch_core as the single WASI path; or (B) route every value-path failure through fs_error_code with tests asserting the WIT index per ErrorKind. Discovered while fixing SR-95 (#637). Maintainer decision 2026-11-07: (A) delete the dead value-ABI path; dispatch_core remains the single WASI path. Verification: no non-test reference to the removed arms, kiln-wasi and kilnd tests green."
    tags: [kiln-wasi, wasi-filesystem, error-code, dead-code]
    provenance:
      created-by: ai
      timestamp: 2026-11-07T06:54:29Z
