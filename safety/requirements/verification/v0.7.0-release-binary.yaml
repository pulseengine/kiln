  - id: VER-REL070-004
    type: verification
    title: "Negative control: each of the 8 required checks goes red on the violation it exists to catch"
    status: verified
    release: v0.7.0
    description: "Scratch PR #596 (never merged), on main 65fe5ff6 with the #595 workflows. Violations: a failing unit test, unformatted code with a broken intra-doc link, unwrap() in library code, forbid(unsafe_code) removed from a crate that is not allow-listed, the vulnerable time 0.1.43 (RUSTSEC-2020-0071), and a #[cfg(doc)] compile_error! (docs-only). Round 2 (9101ae4c), runs 40634787609 / 40634787583 / 40634787626: Core Tests red at Run Tests (negative_control_must_fail, unsafe policy test); CI Checks & Docs red at Check formatting; Safety Analysis with Clippy red on unwrap_used; SCORE red at 'Unsafe code only in allow-listed crates'; Security Audit ubuntu/macos/windows red at 'Audit Cargo.lock'; build (Pages docs) red at 'Build documentation via cargo-kiln' with the planted error. Every failing step was checked to fail on its planted violation, not on infrastructure. Run links: issue #568 comments 6460986391 and 6461842692. The same checks are green on main."
    fields:
      method: test
    links:
      - type: verifies
        target: SR-73
    provenance:
      created-by: ai
      model: claude-opus-5-5
      timestamp: 2026-10-28T23:55:59Z

