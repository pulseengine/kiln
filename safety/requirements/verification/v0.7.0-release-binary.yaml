    description: "kiln built with cargo build --release from main 459c2309; wasm-component-examples v0.5.0 (wasm-components-0.5.0.tar.gz sha256 df22a99593e661e45675eec50e5af19e7dff230222fb9f11dc278b3bc428b910), each component fused by meld 0.62.0 and run with 'kiln --wasi'; reference wasmtime 42.0.1 on the unfused component; stdout and stderr captured to separate files and compared with cmp; 2026-10-28. hello_go fused by meld 0.62.0 instantiates (all descriptor read/write/sync and directory-mutation imports resolve) and runs under kiln: exit 0, stdout 30 B, sha256 78e7fd5b7575f2f7... identical to wasmtime 42.0.1. cargo test -p kiln-wasi in the same tree: 119 + 6 + 4 passed, 0 failed (per-call success inside the preopen and refusal on lexical and symlink escape)."
