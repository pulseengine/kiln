    description: "Release build (cargo build --release --locked -p kilnd) of the v0.7.0 release tree (main fb483580 plus the 0.6.0 -> 0.7.0 bump), streams in two files: 'kilnd --version' exits 0, stdout 'kilnd 0.7.0', stderr exactly 'warning: `kilnd` is deprecated and will be removed in v0.8.0; use `kiln` instead'. 'kiln --version' prints 'kiln 0.7.0' with nothing on stderr. The same single line is the only stderr output of kilnd on the v0.5.0 corpus run (VER-REL070-002)."
