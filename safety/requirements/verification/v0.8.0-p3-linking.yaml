  - id: VER-SR82-001
    type: verification
    title: "SR-82: the seven #620 oracle programs fused by meld 0.67.0 give wasmtime's results on kiln; main CI green"
    status: verified
    release: v0.8.0
    description: "Main push 88db9c30 (PR #668, head 57946c8c); all 9 required checks passed on that head. Main CI on 88db9c30: Rust CI run 43507401513, CodeQL, Security Audit and Analysis, Verification honesty gate and Pages all completed success. Core Tests job 132168536769 logs kilnd p3_thread_tests 15 passed, 0 failed, including the seven oracle programs from kilnd/tests/fixtures/p3_threads (fused by meld 0.67.0): new_resume_returns_7, yield_index_returns_3, suspend_resume_returns_2, yield_then_resume_returns_9, many_threads_returns_36, suspend_then_resume_traps_with_the_synchronous_task_error, promote_traps_with_the_synchronous_task_error (wasmtime 50.0.1 gives the same values and the same 'cannot block a synchronous task before returning' trap). The other eight cover refusals: suffixed thread import without a map in multi-memory, new-indirect without __meld_thread_table, mistyped start function, unknown resume-later handle, wasi-threads spawn, a ready thread left at return, the 1024 live-thread cap, and parked frames counting against the call-depth limit. Supervisor re-run on a fresh build of the PR head gave the same seven values. SR-82 depends on SR-93 (meld >= 0.68 layer), which is not yet verified; this artifact covers SR-82's own oracle only."
    fields:
      method: test
    links:
      - type: verifies
        target: SR-82
    provenance:
      created-by: ai
      model: claude-opus-5-5
      timestamp: 2026-11-14T02:00:00Z

  - id: VER-SR93-001
    type: verification
    title: "SR-93: the upstream Component Model WAST suite runs through meld 0.68.0 fused output on kiln in CI with a ratcheted per-file baseline; main CI green"
    status: verified
    release: v0.8.0
    description: "Main push d9f3e865 (PR #677, head 03f6e4db); all 9 required checks and the Component Model WAST job passed on that head. Main CI on d9f3e865: Rust CI run 43641171947, CodeQL, Security Audit and Analysis, Verification honesty gate and Component Model WAST run 43641171915 completed success (Pages cancelled by the next push). The Component Model WAST job runs the vendored upstream SHA-256 check (WebAssembly/component-model test/ at c818a1925e), the gate fixtures ('all gate fixtures behaved'), `cargo-kiln testsuite --run-cm-wast` over tests/component-model (meld 0.68.0 manifest and 182 fused modules), and scripts/cm-wast-gate.sh against safety/cm-wast-baseline.txt ('OK: the report matches the baseline'). Core Tests job 132588858052 logs ok for the runner's unit tests including cm_wast::tests::manifest_matches_by_directive_line_and_kind and manifest_rejects_unknown_outcomes. Supervisor re-run on the PR branch (release build): 78 files, 5 pass, 32 refused-at-fuse, 41 fail; 686 commands pass, 585 refused-at-fuse, 578 fail; the gate passes. Negative controls (agent, recorded in PR #677): removing a baselined failing file, adding a passing file to the baseline, and corrupting one fused module each make the gate exit 1. The baseline fails on a worse verdict and on a baselined file that starts passing, so unsupported features are listed, not skipped. This is the acceptance oracle SR-82 and SR-84 name; its cross-component linking gap is tracked as SR-114."
