artifacts:

  - id: VER-SR81-001
    type: verification
    title: "SR-81: $N-suffixed host imports resolve and run against the memory meld's import map names; the fused p3_cli runs end to end"
    status: verified
    release: v0.8.0
    description: "Maintainer decision 2026-11-13: SR-81 is verified on the CI tests plus the recorded end-to-end runs; the comparison against wasmtime follows once wasm-component-examples#27 provides a p3_cli that current wasmtime accepts (tracked under SR-101). Main push 49f252d8 (PR #658, head 5591f1b4); all 9 required checks passed on the PR. Rust CI run 43383471363 completed success; Core Tests job 131746368671 logs 19 SR-81 tests ok, among them suffixed_imports_resolve_to_the_base_function_for_link_check_and_dispatch, suffixed_unknown_and_malformed_imports_are_still_refused, the_map_sends_a_suffixed_import_to_the_memory_it_names, without_a_map_the_suffixed_import_is_refused and canon_lowered_suffixed_call_in_a_multi_memory_module_is_refused_without_a_map. Fail-before (agent runs, output in PR #658): the splitter tests, the resolver test, 3 unresolved_import_tests cases, 5 of 7 import_map_tests and the canon-lowered guard failed. End to end (supervisor, release build of 5591f1b4, whose tree equals main 49f252d8): wasm-component-examples v0.5.0 rust_p3/p3_cli.wasm fused by meld 0.66.0 (covalent layer 2026.11.1, --memory multi --emit-import-map), then kiln --import-map p3_cli.imports.json p3_cli.fused.wasm: 'fibonacci 10' -> 'fibonacci(10) = 55', 'prime 97' -> '97 is prime', 'transform uppercase hello' -> 'HELLO', each exit 0; without --import-map, exit 1 with E1B58. Before (main 0715bf1f): refused with E21A0 listing 14 imports suffixed $2 and $5. Open: with no arguments p3_cli's run returns Err after printing usage, yet kiln exited 0; the exit-status mapping is to be checked against wasmtime with the rebuilt fixture."
    fields:
      method: test
    links:
      - type: verifies
        target: SR-81
    provenance:
      created-by: ai
      model: claude-opus-5-5
      timestamp: 2026-11-13T10:00:00Z

