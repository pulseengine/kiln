  - id: VER-SR91-001
    type: verification
    title: "SR-91: clock pollables honour their deadlines in ready, block and poll (unit evidence, main CI green)"
    status: verified
    release: v0.8.0
    description: "Maintainer decision 2026-11-13: SR-91 is verified on unit evidence; the kiln-vs-wasmtime sleep component is part of SR-101. Main push 0715bf1f (PR #656, head d546e880); all 9 required checks passed on the PR. Rust CI run 43368945140 completed success; Core Tests job 131699934360 logs ok for all 9 dispatcher::tests::sr91 tests: subscribe_duration_ready_false_then_block_waits_then_ready (block >= 50 ms), subscribe_instant_future_and_past, poll_waits_for_the_earliest_deadline (returns [1] after >= 40 ms and < 150 ms with a 200 ms sibling), poll_returns_all_ready_indices_in_input_order, poll_without_result_allocation_fails_loud, stream_subscribe_is_a_real_always_ready_pollable, unknown_pollable_handle_is_an_error, dropped_pollable_is_gone, empty_poll_list_is_an_error. Fail-before (on main 06c21cf6, agent run, output in PR #656): 0 passed, 9 failed (subscribe/ready 'Unknown WASI function' 1006, block on an unknown handle succeeded, poll wrote a (0,0) list). Supervisor re-run on the PR head: the sr91 module 9/9 in 3 consecutive runs, kiln-wasi lib 160/160. ADDED 2026-11-18 for AD-WASIPOLL-001 (poll's result buffer through the engine): main push a8973fc3 (PR #684, head 0607dfd6, all 9 required checks passed); Rust CI run 44283329331 completed success; Core Tests job 134729484633 logs ok for kilnd/tests/poll_owned_buffer_tests.rs poll_returns_ready_indices_in_a_cabi_realloc_buffer (through the kiln binary with --wasi, the guest's cabi_realloc sees one call, align 4, size 12; the return area holds that pointer and length 2; indices 1 and 2, the 10 s deadline at index 0 pending) and poll_realloc_trap_propagates (a trapping cabi_realloc fails the run with empty stdout). Planted mutant (supervisor, local): align 4 -> 1 in the engine's poll buffer policy fails the first test (left [1, 1, 12, 1, 2, 1, 2])."
    fields:
      method: test
    links:
