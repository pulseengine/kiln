    description: "Main push fda1935d (PR #650, head 3abfde8f); all 9 required checks passed on the PR. Rust CI run 43293153704 completed success; Core Tests job 131444372732 logs 32 'ok' for dispatcher::tests::sr96::* and none failed or ignored. The tests cover open-at, stat-at, unlink-file-at, remove-directory-at, create-directory-at, rename-at and symlink-at with 'link/', 'link/.', 'dir/../link/' and 'file/', link being a symlink to a directory outside the preopen. Fail-before (supervisor, local): with the tests but without the fix, 27 passed and 5 failed (sr96_open_at_file_slash, sr96_stat_at_file_slash, sr96_unlink_file_at_file_slash, sr96_rename_at_old_file_slash, sr96_rename_at_new_file_slash; rc 101). Scope: the tests assert dispatch_core's return values, not guest memory; until SR-94 (#655) the stat-at error code was written at retptr+4 instead of +8."
