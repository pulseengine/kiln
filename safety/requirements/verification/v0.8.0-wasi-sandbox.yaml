  - id: VER-SR102-001
    type: verification
    title: "SR-102: call, call_indirect, call_ref and return_call reach host imports through one host_call that lowers results, allocates by one policy and validates return-area pointers; main CI green"
    status: verified
    release: v0.8.0
    description: "Main push 86bfe157 (PR #669, head df450d19); all 9 required checks passed on that head. Main CI on 86bfe157: Rust CI run 43536035661, CodeQL, Security Audit and Analysis, Verification honesty gate and Pages all completed success. Core Tests job 132265143201 logs: kilnd owned_return_tests 8/8 (get-random-bytes through call, call_indirect, call_ref and return_call each take one cabi_realloc buffer; an out-of-range return-area pointer fails through call and call_ref), return_area_lowering_tests 2/2 (get-type and input-stream.read write the return area and push no stray operand), owned_buffer_policy_tests 8/8 (per-call get-arguments and get-directories allocations, realloc traps propagate on descriptor.read and input-stream.read), pointer_validation_tests 14/14 (misaligned and out-of-range return-area pointers and cabi_realloc results trap), p3_thread_tests 15/15, kiln-runtime host_import_memory_tests 6/6. Measured on the pre-rebase chain (04491ead, same changes before rebasing onto 88db9c30): WAST spec suite 65980 passed / 529 failed, identical to main at every step; WASI probe differential vs wasmtime over 111 modules: agree 82 -> 98, kiln-accepts-where-wasmtime-traps 23 -> 9, no module moved away from wasmtime. Supervisor re-run on the rebased head: kilnd all pass, kiln-runtime lib 123, kiln-wasi 172, cargo test --workspace all targets pass except one that needs the external/testsuite submodule (passes in CI). Known limit: read-style buffers are reserved at an upper bound, so their cabi_realloc result is checked for alignment and start-in-memory only; exact sizing needs typed returns."
    fields:
      method: test
    links:
      - type: verifies
        target: SR-102
    provenance:
      created-by: ai
      model: claude-opus-5-5
      timestamp: 2026-11-14T03:30:00Z
