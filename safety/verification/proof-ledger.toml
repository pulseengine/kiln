# Proof ledger (SR-121, AD-PROOFLEDGER-001).
#
# Every Kani harness and every input-narrowing site in kiln's sources, checked on
# every PR by `cargo-kiln proof-ledger check` (.github/workflows/proofs.yml):
# - a harness or narrowing site without a row, or a stale row, fails;
# - against the base commit's ledger, no narrowing count, no total, and no
#   [scan].exclude entry may grow, and no floor harness may leave its floor;
# - every [[floor]] harness must report VERIFICATION:- SUCCESSFUL in cargo kani.
#
# Baseline measured 2026-11-25 with kani 0.68.0 (CBMC 6.11): 4 of 110 harness
# markers verify. Each other row says why it does not run.
# Narrowing kinds: assume (kani::assume), unwind (kani::unwind), stub (kani::stub),
# external_body and admit (Verus).

[scan]
# Holds a test fixture string containing the harness attribute, not a harness.
exclude = ["kiln-build-core/src/kani.rs"]

[[floor]]
package = "kiln-async"
features = []
harnesses = [
    "kani_proofs::verify_fsm_step_total_and_terminal_absorbing",
    "kani_proofs::verify_ready_queue_never_overflows",
    "kani_proofs::verify_task_table_generation_aba_safe",
]

[[floor]]
package = "kiln-builtins"
features = []
harnesses = ["proofs::dispatch_import_returns_zero_without_platform"]


[[harness]]
file = "kiln-async/src/kani_proofs.rs"
name = "verify_fsm_step_total_and_terminal_absorbing"
status = "verified"
proves = "TaskState::step (kiln-async/src/task.rs): total over every (state, event); terminal states absorbing"
entry_path = "none yet: kiln-async has no product caller until SR-84 wires it into kiln-builtins"

[[harness]]
file = "kiln-async/src/kani_proofs.rs"
name = "verify_ready_queue_never_overflows"
status = "verified"
proves = "ReadyQueue::push and ReadyQueue::pop (kiln-async/src/ready.rs): len never exceeds capacity over 6 operations"
entry_path = "none yet: kiln-async has no product caller until SR-84 wires it into kiln-builtins"

[[harness]]
file = "kiln-async/src/kani_proofs.rs"
name = "verify_task_table_generation_aba_safe"
status = "verified"
proves = "TaskTable::spawn and TaskTable::remove (kiln-async/src/task.rs): a freed handle no longer resolves after slot reuse"
entry_path = "none yet: kiln-async has no product caller until SR-84 wires it into kiln-builtins"

